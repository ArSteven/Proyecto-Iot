; Proyecto PlatformIO - Clasificador de huevos por peso (ESP32)
; Dos programas en el mismo repo, igual que en los talleres:
;   clasificador -> programa principal (por defecto)
;   calibracion  -> obtiene el factor de la celda de carga real

[platformio]
default_envs = clasificador

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bogde/HX711@^0.7.5
    madhephaestus/ESP32Servo@^3.0.6

[env:clasificador]
build_src_filter = +<clasificador/>

[env:calibracion]
build_src_filter = +<calibracion/>
